<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receipt — NEJstudios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&family=Great+Vibes&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --serif:  'Playfair Display', Georgia, serif;
      --sans:   'Outfit', system-ui, sans-serif;
      --script: 'Great Vibes', cursive;
      --gold:   #c9a84c;
      --red:    #ef4444;
      --green:  #1a7a4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eaeaea;
      color: #000;
      font-family: var(--sans);
      padding: 20px;
    }
    .page {
      max-width: 820px;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 6px 30px rgba(0,0,0,0.2);
      border-radius: 6px;
      overflow: hidden;
    }
    .toolbar-top {
      max-width: 820px;
      margin: 0 auto 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .toolbar-top button {
      padding: 9px 14px;
      background: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 6px;
      color: #000;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: var(--sans);
    }

    /* Header */
    .r-header {
      padding: 30px 36px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      background: #fff;
    }
    .r-logo-block { display: flex; align-items: center; }
    .r-logo-img { width: 130px; height: 130px; object-fit: contain; display: block; }
    .r-logo-fallback {
      display: none; width: 130px; height: 130px; border-radius: 50%;
      background: #000; color: #fff; font-family: var(--script); font-size: 3rem;
      align-items: center; justify-content: center; line-height: 1;
    }
    .r-business { text-align: right; font-family: var(--sans); font-size: 0.78rem; color: #000; }
    .r-business .name { font-family: var(--serif); font-size: 1.6rem; font-weight: 700; margin: 0 0 4px; }
    .r-business .addr { color: #333; line-height: 1.45; }

    /* Title bar */
    .r-title-bar {
      background: var(--green);
      color: #fff;
      padding: 22px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .r-title-bar .left {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.9rem;
      font-weight: 600;
    }
    .r-title-bar .right {
      font-family: var(--sans);
      font-size: 0.82rem;
      opacity: 0.9;
    }
    .r-title-bar .right strong { font-size: 1.05rem; }

    /* Bill row */
    .r-bill-row {
      padding: 20px 36px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    .r-bill-to .label { font-weight: 500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: #666; }
    .r-bill-to .name { font-size: 1rem; margin-top: 4px; }
    .r-bill-to .addr { font-size: 0.78rem; color: #444; margin-top: 3px; }
    .r-invoice-ref {
      align-self: end;
      text-align: right;
      font-size: 0.85rem;
    }
    .r-invoice-ref .k { color: #666; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .r-invoice-ref .v { font-weight: 700; }

    /* Body */
    .r-body { padding: 26px 36px; }
    .r-amount-box {
      padding: 26px;
      background: linear-gradient(135deg, #f8f4e8, #f3e9c9);
      border: 1px solid #d4c380;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 26px;
    }
    .r-amount-box .k {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #7a6420;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .r-amount-box .amount {
      font-family: var(--serif);
      font-size: 3rem;
      color: #000;
      font-weight: 700;
      line-height: 1;
    }
    .r-amount-box .in-words {
      font-family: var(--sans);
      font-size: 0.8rem;
      color: #7a6420;
      font-style: italic;
      margin-top: 8px;
    }

    .r-payment-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .r-payment-cell {
      padding: 14px 16px;
      background: #f8f8f8;
      border: 1px solid #e4e4e4;
      border-radius: 8px;
    }
    .r-payment-cell .k {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      margin-bottom: 6px;
    }
    .r-payment-cell .v {
      font-size: 1rem;
      font-weight: 600;
      color: #000;
    }

    .r-summary {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .r-summary h4 {
      font-family: var(--serif);
      margin: 0 0 12px;
      font-size: 1.05rem;
    }
    .r-summary-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 0.86rem;
    }
    .r-summary-row.total {
      border-top: 1px solid #ddd;
      margin-top: 8px;
      padding-top: 10px;
      font-weight: 700;
      font-size: 1rem;
    }
    .r-summary-row .amt.outstanding { color: var(--red); }

    /* Footer */
    .r-footer {
      padding: 26px 36px 24px;
      background: #fff;
      color: #000;
      text-align: center;
      font-family: var(--script);
      font-size: 1.5rem;
      border-top: 1px solid #eee;
    }
    .r-sign-line {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 24px 36px 32px;
      background: #fff;
    }
    .r-sign-line .cell {
      text-align: center;
    }
    .r-sign-line .line {
      border-top: 1px solid #333;
      padding-top: 6px;
      font-size: 0.72rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    @media (max-width: 720px) {
      body { padding: 10px; }
      .r-header { padding: 20px 20px 16px; flex-direction: column; gap: 14px; }
      .r-business { text-align: left; }
      .r-title-bar { padding: 18px 20px; flex-direction: column; align-items: flex-start; gap: 6px; }
      .r-title-bar .left { font-size: 1.6rem; }
      .r-bill-row { padding: 18px 20px; grid-template-columns: 1fr; }
      .r-body { padding: 20px; }
      .r-amount-box .amount { font-size: 2.2rem; }
      .r-payment-grid { grid-template-columns: 1fr; }
      .r-sign-line { grid-template-columns: 1fr; padding: 16px 20px 22px; }
      .r-footer { padding: 22px 20px 18px; font-size: 1.25rem; }
    }
    @media print {
      body { background: #fff; padding: 0; }
      .toolbar-top { display: none; }
      .page { box-shadow: none; border-radius: 0; max-width: none; }
      @page { margin: 0; }
    }

    #loadingState, #errorState { text-align: center; padding: 60px 20px; color: #666; }
    #errorState { color: #b03030; }
  </style>
</head>
<body>
  <div class="toolbar-top">
    <div style="font-size:0.85rem;color:#333">Match this receipt against invoice <strong id="invRefTop">—</strong></div>
    <div>
      <button onclick="window.print()">🖨 Print / Save PDF</button>
    </div>
  </div>

  <div class="page" id="pageWrap">
    <div id="loadingState">Loading receipt…</div>
  </div>

  <script>
    const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const fmt = (n) => Number(n || 0).toLocaleString('en-NG');

    const urlNo = new URLSearchParams(location.search).get('no');
    if (!urlNo) { document.getElementById('pageWrap').innerHTML = '<div id="errorState">No invoice number in URL.</div>'; }
    else load();

    async function load() {
      try {
        const r = await fetch('/api/sync.php?resource=invoices', { cache: 'no-store' });
        const list = r.ok ? await r.json() : [];
        const inv = Array.isArray(list) ? list.find(x => x.invoiceNo === urlNo) : null;
        if (!inv) { document.getElementById('pageWrap').innerHTML = `<div id="errorState">Invoice ${esc(urlNo)} not found. Save it first from the invoice creator.</div>`; return; }
        renderReceipt(inv);
      } catch (e) {
        document.getElementById('pageWrap').innerHTML = '<div id="errorState">Could not load invoice data.</div>';
      }
    }

    // Convert a number to English words (simple, ceiling at billions - enough for invoices)
    function numToWords(n) {
      const ones = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine',
                    'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen',
                    'seventeen', 'eighteen', 'nineteen'];
      const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
      function under1000(x) {
        if (x < 20) return ones[x];
        if (x < 100) return tens[Math.floor(x/10)] + (x%10 ? '-' + ones[x%10] : '');
        return ones[Math.floor(x/100)] + ' hundred' + (x%100 ? ' and ' + under1000(x%100) : '');
      }
      if (n === 0) return 'zero';
      let str = '';
      const bn = Math.floor(n / 1e9); n = n % 1e9;
      const mn = Math.floor(n / 1e6); n = n % 1e6;
      const th = Math.floor(n / 1e3); n = n % 1e3;
      if (bn) str += under1000(bn) + ' billion, ';
      if (mn) str += under1000(mn) + ' million, ';
      if (th) str += under1000(th) + ' thousand, ';
      if (n)  str += under1000(n);
      return str.replace(/, $/, '').trim();
    }

    function renderReceipt(inv) {
      document.getElementById('invRefTop').textContent = '#' + inv.invoiceNo;

      const total = (inv.packages || []).reduce((s, p) => s + Number(p.total || 0), 0);
      const dep = Number(inv.depositPaid || 0);
      const bal = Number(inv.balancePaid || 0);
      const received = dep + bal;
      const outstanding = Math.max(0, total - received);
      const words = received ? numToWords(received) + ' naira only' : '';

      const packageList = (inv.packages || []).map(p => `
        <div class="r-summary-row">
          <span>${esc(p.label)}</span>
          <span class="amt">₦${fmt(p.total)}</span>
        </div>
      `).join('');

      const receivedDate = new Date().toLocaleDateString('en-NG', { day: '2-digit', month: 'long', year: 'numeric' });

      document.getElementById('pageWrap').innerHTML = `
        <div class="r-header">
          <div class="r-logo-block">
            <img class="r-logo-img" src="images/nej-logo.png" alt="NEJstudios" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
            <div class="r-logo-fallback">Nej</div>
          </div>
          <div class="r-business">
            <div class="name">${esc(inv.bizName || 'NEJstudios')}</div>
            <div class="addr">${inv.bizAddr || ''}</div>
            <div style="margin-top:8px">${esc(receivedDate)}</div>
          </div>
        </div>

        <div class="r-title-bar">
          <div class="left">Receipt</div>
          <div class="right">Invoice Ref: <strong>#${esc(inv.invoiceNo)}</strong></div>
        </div>

        <div class="r-bill-row">
          <div class="r-bill-to">
            <div class="label">Received From</div>
            <div class="name">${esc(inv.billTo || '')}</div>
            ${inv.billToAddress ? `<div class="addr">${inv.billToAddress}</div>` : ''}
          </div>
          <div class="r-invoice-ref">
            <div class="k">Payment Date</div>
            <div class="v">${esc(receivedDate)}</div>
          </div>
        </div>

        <div class="r-body">
          <div class="r-amount-box">
            <div class="k">Amount Received</div>
            <div class="amount">₦${fmt(received)}</div>
            ${words ? `<div class="in-words">(${words})</div>` : ''}
          </div>

          <div class="r-payment-grid">
            ${dep ? `
              <div class="r-payment-cell">
                <div class="k">Deposit</div>
                <div class="v">₦${fmt(dep)}</div>
              </div>` : ''}
            ${bal ? `
              <div class="r-payment-cell">
                <div class="k">Balance Payment</div>
                <div class="v">₦${fmt(bal)}</div>
              </div>` : ''}
            <div class="r-payment-cell">
              <div class="k">Invoice Total</div>
              <div class="v">₦${fmt(total)}</div>
            </div>
            <div class="r-payment-cell">
              <div class="k">Outstanding</div>
              <div class="v" style="color:${outstanding ? 'var(--red)' : 'var(--green)'}">${outstanding ? '₦' + fmt(outstanding) : '₦0 — Paid in Full'}</div>
            </div>
          </div>

          <div class="r-summary">
            <h4>Invoice Summary — ${esc(inv.packageTitle || '')}</h4>
            ${packageList || '<div style="font-size:0.82rem;color:#888">No line items.</div>'}
            <div class="r-summary-row total">
              <span>Invoice Total</span>
              <span class="amt">₦${fmt(total)}</span>
            </div>
          </div>
        </div>

        <div class="r-sign-line">
          <div class="cell">
            <div class="line">Received By (NEJstudios)</div>
          </div>
          <div class="cell">
            <div class="line">Payer's Signature</div>
          </div>
        </div>

        <div class="r-footer">${esc(inv.footerNote || 'Thank you for your payment.')}</div>
      `;
    }
  </script>
</body>
</html>
