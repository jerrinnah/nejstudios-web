<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receipt — NEJstudios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&family=Great+Vibes&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --serif:  'Playfair Display', Georgia, serif;
      --sans:   'Outfit', system-ui, sans-serif;
      --script: 'Great Vibes', cursive;
      --yellow: #f5c400;
      --black:  #1a1a1a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #e8e8e8;
      color: #000;
      font-family: var(--sans);
      padding: 20px;
    }
    .page {
      max-width: 820px;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 6px 30px rgba(0,0,0,0.2);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .toolbar-top {
      max-width: 820px;
      margin: 0 auto 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .toolbar-top button {
      padding: 9px 14px;
      background: var(--yellow);
      border: 1px solid var(--yellow);
      border-radius: 6px;
      color: var(--black);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: var(--sans);
    }

    /* ── HEADER ── */
    .r-header {
      padding: 34px 60px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 22px;
    }
    .r-logo-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }
    .r-logo-fallback {
      display: none;
      width: 90px; height: 90px; border-radius: 50%;
      background: var(--black); color: #fff; font-family: var(--script); font-size: 2.2rem;
      align-items: center; justify-content: center; line-height: 1;
    }
    .r-business {
      font-family: var(--sans);
      font-size: 0.86rem;
      color: #4a4a4a;
      line-height: 1.55;
      flex: 1;
      max-width: 300px;
    }

    /* ── DIAGONAL ACCENT BAR ── */
    .r-accent {
      margin: 30px 0 0;
      display: flex;
      height: 22px;
      position: relative;
    }
    .r-accent::before {
      content: '';
      flex: 1;
      background: var(--yellow);
      clip-path: polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%);
    }
    .r-accent::after {
      content: '';
      flex: 1;
      background: var(--black);
      clip-path: polygon(22px 0, 100% 0, 100% 100%, 0 100%);
    }

    /* ── TITLE ── */
    .r-title-block {
      padding: 46px 60px 32px;
      text-align: center;
    }
    .r-title-block h1 {
      font-family: var(--serif);
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--black);
      margin: 0 0 22px;
      letter-spacing: -0.01em;
    }
    .r-meta {
      font-size: 0.95rem;
      color: #333;
      padding-bottom: 24px;
      border-bottom: 1px solid #d0d0d0;
    }
    .r-meta strong { font-weight: 600; }
    .r-meta .sep { margin: 0 12px; color: #999; }

    /* ── PARTIES TABLE ── */
    .r-section {
      padding: 30px 60px;
    }
    .r-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    .r-table th {
      background: #f5f5f5;
      color: #3a3a3a;
      font-weight: 400;
      text-align: center;
      padding: 14px 18px;
      border-bottom: 1px solid #e0e0e0;
      font-size: 0.9rem;
    }
    .r-table td {
      padding: 14px 18px;
      vertical-align: top;
      color: #000;
      font-size: 0.9rem;
      border-bottom: 1px solid #f0f0f0;
    }
    .r-table td strong { font-weight: 700; display: block; margin-bottom: 3px; }
    .r-table .col-half { width: 50%; }
    .r-table .col-half + .col-half { border-left: 1px solid #f0f0f0; }

    /* ── TRANSACTION DETAILS ── */
    .r-txn-title {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--black);
      margin: 30px 60px 14px;
    }
    .r-txn-table {
      width: calc(100% - 120px);
      margin: 0 60px 30px;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    .r-txn-table th {
      background: #f5f5f5;
      color: #3a3a3a;
      font-weight: 400;
      text-align: center;
      padding: 14px 16px;
      border-bottom: 1px solid #e0e0e0;
    }
    .r-txn-table td {
      padding: 16px 16px;
      color: #000;
      border-bottom: 1px solid #f0f0f0;
    }
    .r-txn-table .amt { text-align: center; font-variant-numeric: tabular-nums; }
    .r-txn-table .method { text-align: center; }
    .r-txn-table tr.total td {
      font-weight: 700;
      background: #fafafa;
      font-size: 0.98rem;
      border-bottom: none;
    }

    /* ── FOOTER ── */
    .r-footer-note {
      padding: 4px 60px 46px;
      font-size: 0.92rem;
      color: #333;
      line-height: 1.6;
    }
    .r-footer-note strong { font-weight: 700; }

    @media (max-width: 720px) {
      body { padding: 10px; }
      .r-header { padding: 24px 24px 0; flex-direction: column; align-items: center; text-align: center; gap: 16px; }
      .r-business { text-align: center; max-width: none; }
      .r-title-block { padding: 30px 24px 22px; }
      .r-title-block h1 { font-size: 1.9rem; }
      .r-section { padding: 22px 24px; }
      .r-table th, .r-table td { padding: 10px 12px; font-size: 0.82rem; }
      .r-txn-title { margin: 22px 24px 12px; font-size: 1rem; }
      .r-txn-table { width: calc(100% - 48px); margin: 0 24px 22px; }
      .r-txn-table th, .r-txn-table td { padding: 10px 8px; font-size: 0.78rem; }
      .r-footer-note { padding: 0 24px 32px; font-size: 0.85rem; }
    }
    @media print {
      body { background: #fff; padding: 0; }
      .toolbar-top { display: none; }
      .page { box-shadow: none; border-radius: 0; max-width: none; }
      @page { margin: 0; }
    }

    #loadingState, #errorState { text-align: center; padding: 60px 20px; color: #666; }
    #errorState { color: #b03030; }
  </style>
</head>
<body>
  <div class="toolbar-top">
    <div style="font-size:0.85rem;color:#333">Receipt for invoice <strong id="invRefTop">—</strong></div>
    <div>
      <button onclick="window.print()">🖨 Print / Save PDF</button>
    </div>
  </div>

  <div class="page" id="pageWrap">
    <div id="loadingState">Loading receipt…</div>
  </div>

  <script>
    const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const fmt = (n) => Number(n || 0).toLocaleString('en-NG');

    const urlNo = new URLSearchParams(location.search).get('no');
    if (!urlNo) { document.getElementById('pageWrap').innerHTML = '<div id="errorState">No invoice number in URL.</div>'; }
    else load();

    async function load() {
      try {
        const r = await fetch('/api/sync.php?resource=invoices', { cache: 'no-store' });
        const list = r.ok ? await r.json() : [];
        const inv = Array.isArray(list) ? list.find(x => x.invoiceNo === urlNo) : null;
        if (!inv) { document.getElementById('pageWrap').innerHTML = `<div id="errorState">Invoice ${esc(urlNo)} not found. Save it first from the invoice creator.</div>`; return; }
        renderReceipt(inv);
      } catch (e) {
        document.getElementById('pageWrap').innerHTML = '<div id="errorState">Could not load invoice data.</div>';
      }
    }

    function renderReceipt(inv) {
      document.getElementById('invRefTop').textContent = '#' + inv.invoiceNo;

      const total = (inv.packages || []).reduce((s, p) => s + Number(p.total || 0), 0);
      const dep = Number(inv.depositPaid || 0);
      const bal = Number(inv.balancePaid || 0);
      const received = dep + bal;
      const outstanding = Math.max(0, total - received);

      // Build a receipt number from the invoice number (e.g. R-239820-<yyyymmdd>)
      const now = new Date();
      const yyyymmdd = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
      const receiptNo = 'R-' + inv.invoiceNo + '-' + yyyymmdd.slice(-4);
      const receiptDate = now.toLocaleDateString('en-NG', { day: 'numeric', month: 'long', year: 'numeric' });

      // Transaction rows: deposit + balance if any, then total
      const rows = [];
      if (dep) rows.push({ label: 'Deposit Payment', amount: dep, method: 'Bank Transfer' });
      if (bal) rows.push({ label: 'Balance Payment', amount: bal, method: 'Bank Transfer' });
      if (!rows.length) rows.push({ label: 'Payment Received', amount: received, method: 'Bank Transfer' });

      // Format the business address for "Received By"
      const bizAddrText = (inv.bizAddr || '').replace(/<br\s*\/?>/gi, ', ').replace(/\s+,/g, ',');

      document.getElementById('pageWrap').innerHTML = `
        <div class="r-header">
          <img class="r-logo-img" src="images/nej-logo.png" alt="NEJstudios" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
          <div class="r-logo-fallback">Nej</div>
          <div class="r-business">
            ${inv.bizAddr || ''}<br>
            ${inv.bizEmail ? esc(inv.bizEmail) + '<br>' : ''}
            ${inv.bizPhone ? esc(inv.bizPhone) : ''}
          </div>
        </div>

        <div class="r-accent"></div>

        <div class="r-title-block">
          <h1>Cash Receipt</h1>
          <div class="r-meta">
            <strong>Receipt Number:</strong> ${esc(receiptNo)}
            <span class="sep">|</span>
            <strong>Date:</strong> ${esc(receiptDate)}
          </div>
        </div>

        <div class="r-section">
          <table class="r-table">
            <thead>
              <tr>
                <th class="col-half">Received From</th>
                <th class="col-half">Received By</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="col-half">
                  <strong>${esc(inv.billTo || '')}</strong>
                  ${inv.billToEmail ? esc(inv.billToEmail) + '<br>' : ''}
                  ${inv.billToAddress ? inv.billToAddress.replace(/<br\s*\/?>/gi, '<br>') : ''}
                </td>
                <td class="col-half">
                  <strong>${esc(inv.bizName || 'NEJstudios')}</strong>
                  ${esc(bizAddrText)}
                  ${inv.bankName ? '<br>Bank: ' + esc(inv.bankName) : ''}
                  ${inv.accountNumber ? '<br>Acc: ' + esc(inv.accountNumber) : ''}
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <h2 class="r-txn-title">Transaction Details</h2>
        <table class="r-txn-table">
          <thead>
            <tr>
              <th>Item Description</th>
              <th class="amt">Amount (₦)</th>
              <th class="method">Payment Method</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td>${esc(r.label)}</td>
                <td class="amt">₦${fmt(r.amount)}</td>
                <td class="method">${esc(r.method)}</td>
              </tr>
            `).join('')}
            <tr class="total">
              <td><strong>Total Amount</strong></td>
              <td class="amt"><strong>₦${fmt(received)}</strong></td>
              <td class="method"></td>
            </tr>
            ${outstanding ? `
              <tr>
                <td style="color:#b03030">Outstanding Balance</td>
                <td class="amt" style="color:#b03030">₦${fmt(outstanding)}</td>
                <td class="method">—</td>
              </tr>` : ''}
          </tbody>
        </table>

        <p class="r-footer-note">
          Thank you for your payment! ${outstanding
            ? `An outstanding balance of <strong>₦${fmt(outstanding)}</strong> remains on invoice <strong>#${esc(inv.invoiceNo)}</strong>. `
            : `Your invoice <strong>#${esc(inv.invoiceNo)}</strong> has been fully settled. `}
          Should you have any questions or need further assistance, please contact us at <strong>${esc(inv.bizEmail || 'hello@nejstudios.com')}</strong>.
        </p>
      `;
    }
  </script>
</body>
</html>
