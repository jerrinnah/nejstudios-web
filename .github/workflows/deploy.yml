name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cPanel Git pull
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://nejstudios.com:2083/execute/VersionControl/update?repository_root=%2Fhome3%2Fnejstudi%2Frepositories%2Fnejstudios-web")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Response: $BODY"
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then exit 1; fi

      - name: Deploy HEAD commit
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://nejstudios.com:2083/execute/VersionControlDeployment/create?repository_root=%2Fhome3%2Fnejstudi%2Frepositories%2Fnejstudios-web")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Response: $BODY"
          echo "HTTP status: $HTTP_STATUS"
