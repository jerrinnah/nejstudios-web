name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cPanel Git pull and deploy
        run: |
          curl -s -o response.json -w "%{http_code}" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://nejstudios.com:2083/execute/VersionControl/update?repository_root=%2Fhome%2Fnejstudi%2Frepositories%2Fnejstudios-web" \
            -o /dev/null -w "%{http_code}" > status.txt
          cat response.json || true
          STATUS=$(cat status.txt)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then exit 1; fi

      - name: Trigger HEAD commit deployment
        run: |
          curl -s \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://nejstudios.com:2083/execute/VersionControlDeployment/create?repository_root=%2Fhome%2Fnejstudi%2Frepositories%2Fnejstudios-web"
