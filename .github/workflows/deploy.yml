name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 60000
          log-level: verbose
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git/**
            **/.github/**
            .cpanel.yml
            .gitignore
            .gitmodules
            nej-old web/**
            claude/**
            uploads/**
            api/data/**
            api/rate_limits/**
            **/.DS_Store
            *.zip
